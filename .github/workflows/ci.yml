name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Run lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run type checks
        run: mypy
      - name: Build package
        run: python -m build
      - name: Run CLI and privacy smoke checks
        run: |
          face-analytics --help
          face-analytics privacy-audit --root . --db artifacts/ci-privacy.sqlite3

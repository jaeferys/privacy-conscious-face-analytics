[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-conscious-face-analytics"
version = "0.6.0"
description = "Privacy-conscious aggregate foot-traffic analytics for retail and events"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Jaeferys" }
]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "streamlit>=1.40,<2",
  "mediapipe>=0.10.14,<0.11; python_version < '3.13'",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
face-analytics = "face_analytics.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
face_analytics = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["face_analytics"]

[[tool.mypy.overrides]]
module = [
  "cv2",
  "mediapipe",
  "numpy",
  "numpy.*",
  "pandas",
  "pandas.*",
  "streamlit",
  "streamlit.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-face-analytics"
version = "0.1.0"
description = "Privacy-conscious aggregate foot-traffic analytics for retail and events"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Jaeferys" }
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[tool.setuptools.packages.find]
where = ["src"]
